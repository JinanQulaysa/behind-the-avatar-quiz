<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080C17">
  <meta name="description" content="Behind the Avatar: a three-mission cyber safety challenge about protecting children in online games.">
  <title>Behind the Avatar | The Cyber Safety Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg:#080C17;
      --bg2:#0B1120;
      --card:#111827;
      --purple:#A58CFF;
      --cyan:#73DDEF;
      --green:#A4F6B4;
      --white:#F6F8FF;
      --muted:#A6B2C9;
      --line:rgba(157,179,226,.17);
      --line-strong:rgba(157,179,226,.29);
      --shadow:0 24px 70px rgba(0,0,0,.23);
      --radius:22px;
    }
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--white);font-family:'Space Grotesk','Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;background-image:linear-gradient(rgba(112,147,214,.043) 1px,transparent 1px),linear-gradient(90deg,rgba(112,147,214,.043) 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
    .ambient{pointer-events:none;position:fixed;inset:0;z-index:-2;overflow:hidden}
    .glow{position:absolute;border-radius:50%;filter:blur(95px);opacity:.17}
    .g1{width:510px;height:510px;background:#7352CB;left:-210px;top:-190px}
    .g2{width:430px;height:430px;background:#1C8CA5;right:-230px;top:210px;opacity:.12}
    .g3{width:380px;height:380px;background:#32935A;left:25%;bottom:-310px;opacity:.085}
    button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.6}
    button,input{accent-color:var(--green)}
    /* Give every SVG icon explicit dimensions (without this they default to 300 × 150px). */
    svg.ico{display:inline-block;width:20px;height:20px;flex-shrink:0;vertical-align:middle}
    :focus-visible{outline:3px solid var(--green);outline-offset:3px}
    ::selection{background:var(--purple);color:#060a12}
    .shell{width:min(1090px,calc(100% - 48px));margin-inline:auto}
    .topbar{background:rgba(8,12,23,.83);border-bottom:1px solid rgba(181,196,231,.09);backdrop-filter:blur(18px);position:relative;z-index:2}
    .top-inner{min-height:82px;display:flex;justify-content:space-between;align-items:center;gap:18px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand-mark{width:44px;height:44px;border-radius:14px;border:1px solid rgba(164,246,180,.26);background:rgba(164,246,180,.065);display:grid;place-items:center;color:var(--green)}
    .brand-title{font-size:14px;line-height:1.35;font-weight:700;letter-spacing:.075em}
    .brand-sub{display:block;margin-top:4px;color:#94A6C1;font-size:9px;letter-spacing:.19em;font-weight:700}
    .top-tag{font-size:10px;letter-spacing:.11em;font-weight:700;color:#C6D0E5;border:1px solid var(--line);padding:10px 15px;border-radius:999px;white-space:nowrap}
    .main{padding-top:46px;padding-bottom:64px;min-height:calc(100vh - 162px)}
    .footer{border-top:1px solid rgba(181,196,231,.11);padding:21px 0 27px;color:#8492AB;font-size:11px}
    .footer-in{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(115,221,239,.22);background:rgba(115,221,239,.055);border-radius:99px;padding:9px 15px;font-size:10px;letter-spacing:.17em;font-weight:700;color:#BBE9F3}
    .pulse{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 15px rgba(164,246,180,.7);flex:none}
    h1,h2,h3,p{overflow-wrap:break-word}
    h1{font-size:clamp(46px,6.1vw,77px);line-height:1.055;letter-spacing:-.058em;margin:24px 0 16px;font-weight:700}
    h2{font-size:clamp(31px,4.3vw,48px);letter-spacing:-.05em;line-height:1.15;margin:10px 0 12px}
    h3{font-size:18px;letter-spacing:-.02em;margin:0}
    .gradient{background:linear-gradient(110deg,#BAA6FF 0%,var(--cyan) 62%,var(--green) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .intro-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:40px;align-items:center;padding-block:36px 42px}
    .intro-text .lead{font-size:17px;line-height:1.7;color:#C9D5E7;max-width:500px;margin:0 0 19px;font-weight:500}
    .intro-text .desc{font-size:13px;line-height:1.95;color:var(--muted);max-width:510px;margin:0 0 31px}
    .hero-actions{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:11px;padding:14px 21px;min-height:49px;border-radius:13px;border:1px solid transparent;font-size:13px;font-weight:700;text-align:center;text-decoration:none;transition:transform .16s,border-color .16s,background .16s}
    .btn:hover:not(:disabled){transform:translateY(-2px)}
    .btn-primary{background:linear-gradient(110deg,#B1F8BD,#75E0E8);color:#081520;box-shadow:0 11px 35px rgba(135,237,189,.13)}
    .btn-outline{background:rgba(255,255,255,.035);border-color:var(--line-strong);color:var(--white)}
    .btn-outline:hover{border-color:rgba(165,140,255,.65)}
    .btn-small{font-size:12px;min-height:43px;padding:11px 16px}
    .btn .ico{width:17px;height:17px}
    .mini-stats{display:flex;flex-wrap:wrap;gap:11px;margin-top:27px}
    .mini-stat{display:inline-flex;gap:8px;align-items:center;color:#AEBFD5;font-size:11px;font-weight:600}
    .mini-stat .ico{width:16px;height:16px;color:var(--green)}
    .mission-preview{position:relative;background:linear-gradient(150deg,rgba(31,40,66,.95),rgba(13,20,35,.98));border:1px solid var(--line-strong);border-radius:27px;padding:27px;box-shadow:var(--shadow);overflow:hidden}
    .mission-preview::after{content:"";position:absolute;right:-75px;top:-95px;height:230px;width:230px;border-radius:50%;background:rgba(165,140,255,.13);filter:blur(52px);pointer-events:none}
    .panel-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:23px}
    .panel-label{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--muted)}
    .panel-status{display:inline-flex;align-items:center;gap:7px;background:rgba(164,246,180,.06);border:1px solid rgba(164,246,180,.17);border-radius:99px;padding:8px 11px;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--green)}
    .mission-row{display:flex;align-items:center;gap:15px;padding:19px 16px;background:rgba(8,12,23,.48);border:1px solid rgba(177,192,225,.12);border-radius:16px;margin-top:10px}
    .mission-no{width:47px;height:47px;flex:none;display:grid;place-items:center;border-radius:14px;font-weight:700;font-size:15px}
    .mission-no.purple{color:#D5C7FF;background:rgba(165,140,255,.11);border:1px solid rgba(165,140,255,.3)}
    .mission-no.cyan{color:#B8F4FC;background:rgba(115,221,239,.09);border:1px solid rgba(115,221,239,.27)}
    .mission-no.green{color:#CCFAD2;background:rgba(164,246,180,.085);border:1px solid rgba(164,246,180,.28)}
    .mission-info{flex:1;min-width:0}
    .mission-info strong{display:block;font-size:14px;line-height:1.4}
    .mission-info span{display:block;color:var(--muted);font-size:11px;line-height:1.6;margin-top:5px}
    .mission-row .ico{width:20px;height:20px;color:#7F8BA5;flex:none}
    .welcome-note{margin-top:23px;padding:19px 23px;border:1px solid rgba(115,221,239,.16);background:linear-gradient(90deg,rgba(115,221,239,.055),rgba(164,246,180,.035));border-radius:16px;display:flex;align-items:center;gap:13px;color:#BFCFE1;font-size:12px;line-height:1.8}
    .welcome-note .ico{width:25px;height:25px;flex:none;color:var(--cyan)}
    .progress-row{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}
    .progress-left{font-size:10px;letter-spacing:.16em;font-weight:700;color:var(--green)}
    .progress-right{font-size:11px;color:var(--muted);font-weight:600}
    .progress-track{height:5px;border-radius:99px;background:rgba(163,186,231,.13);overflow:hidden;margin-bottom:37px}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan),var(--green));border-radius:99px;transition:width .35s ease}
    .mission-heading{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:25px}
    .mission-heading p{font-size:13px;line-height:1.85;color:var(--muted);max-width:680px;margin:0}
    .mission-chip{border:1px solid var(--line-strong);padding:11px 13px;border-radius:13px;white-space:nowrap;color:#D3E5F1;font-size:11px;font-weight:700;background:rgba(17,24,39,.7)}
    .main-card{background:linear-gradient(153deg,rgba(28,36,56,.89),rgba(17,24,39,.97));border:1px solid var(--line);border-radius:var(--radius);padding:25px 28px;box-shadow:0 17px 45px rgba(0,0,0,.12)}
    .card-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}
    .card-top-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;color:#D9E5F2}
    .card-top-title .ico{color:var(--cyan);width:19px;height:19px}
    .card-hint{font-size:11px;color:var(--muted)}
    .chat-panel{background:rgba(7,12,24,.72);border:1px solid rgba(150,171,211,.18);border-radius:17px;overflow:hidden}
    .chat-header{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.025)}
    .profile-badge{width:37px;height:37px;display:grid;place-items:center;border-radius:12px;background:rgba(165,140,255,.14);border:1px solid rgba(165,140,255,.28);color:#D4C9FF;font-weight:700}
    .profile-name{font-size:12px;font-weight:700}
    .profile-detail{font-size:10px;color:var(--muted);margin-top:3px}
    .header-dots{margin-left:auto;color:#7E8CA7;letter-spacing:.2em;font-weight:700}
    .chat-list{padding:22px 23px;display:flex;flex-direction:column;gap:16px}
    .bubble-row{display:flex;flex-direction:column;align-items:flex-start;gap:5px;max-width:min(90%,590px)}
    .bubble-row.child{align-self:flex-end;align-items:flex-end;max-width:min(83%,500px)}
    .bubble-who{font-size:10px;font-weight:700;color:#A5B1CA;margin:0 0 1px 4px}
    .bubble-row.child .bubble-who{color:var(--cyan);margin-right:4px}
    .bubble{border:1px solid rgba(183,196,223,.18);border-radius:14px 14px 14px 3px;background:#1C2842;color:#E5EEFF;text-align:left;padding:13px 16px;font-size:13px;line-height:1.6;width:100%}
    button.bubble{transition:background .16s,border-color .16s;position:relative;padding-right:41px}
    button.bubble:hover{border-color:rgba(165,140,255,.5);background:#253250}
    button.bubble.selected{background:rgba(165,140,255,.14);border-color:rgba(165,140,255,.86);box-shadow:inset 0 0 0 1px rgba(165,140,255,.19)}
    button.bubble.selected::after{content:"✓";width:23px;height:23px;border:1px solid rgba(165,140,255,.75);border-radius:50%;position:absolute;right:11px;top:11px;display:grid;place-items:center;color:#EBE6FF;font-size:12px}
    .bubble.child-bubble{background:rgba(115,221,239,.085);border-color:rgba(115,221,239,.18);border-radius:14px 14px 3px 14px;color:#D9F4FA}
    .chat-help{font-size:11px;line-height:1.7;margin:4px 0 0;color:#A7B6CD}
    .mission-bottom{display:flex;align-items:center;justify-content:space-between;gap:17px;margin-top:23px;flex-wrap:wrap}
    .selected-count{color:#B7C4DA;font-size:12px}
    .selected-count strong{color:var(--purple)}
    .question-stack{display:grid;gap:15px}
    .scenario{border:1px solid var(--line);background:linear-gradient(130deg,rgba(22,31,50,.86),rgba(14,22,38,.93));border-radius:18px;padding:22px 23px}
    .scenario-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .scenario-index{color:var(--purple);font-size:10px;font-weight:700;letter-spacing:.13em}
    .scenario-value{font-size:10px;color:#91A1BB}
    .scenario-text{font-size:14px;line-height:1.8;font-weight:500;color:#E3EBFA;margin:0 0 18px}
    .choice-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:400px}
    .choice-row .choice{width:100%;min-width:0;height:48px;padding:0 12px;display:flex;justify-content:center;align-items:center;gap:9px;text-align:center;white-space:nowrap}
    .choice-row .choice svg.ico{display:block;width:18px;height:18px;min-width:18px;min-height:18px;flex:0 0 18px}
    .choice{padding:11px 17px;min-height:43px;border-radius:11px;border:1px solid rgba(169,186,224,.24);background:rgba(255,255,255,.035);color:#D6E0F0;font-size:12px;font-weight:700;text-align:left;transition:background .16s,border-color .16s}
    .choice:hover{border-color:rgba(115,221,239,.53)}
    .choice.picked{background:rgba(115,221,239,.13);border-color:var(--cyan);color:#E2FCFF}
    .choice .tag{font-size:10px;margin-right:9px;color:#9DAEC6}
    .wide-choices{display:grid;grid-template-columns:1fr;gap:9px}
    .wide-choices .choice{width:100%;padding:13px 15px;line-height:1.5;font-weight:600}
    .wide-choices .choice.picked .tag{color:var(--cyan)}
    .story{display:flex;align-items:flex-start;gap:15px;border:1px solid rgba(115,221,239,.22);border-radius:18px;background:linear-gradient(110deg,rgba(115,221,239,.07),rgba(165,140,255,.055));padding:22px;margin-bottom:23px}
    .story-icon{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:13px;background:rgba(115,221,239,.09);color:var(--cyan)}
    .story h3{font-size:15px;margin-bottom:7px}
    .story p{font-size:12px;line-height:1.86;color:#C2D0E2;margin:0}
    .alert{margin-top:14px;padding:12px 15px;border-radius:11px;border:1px solid rgba(255,205,132,.4);background:rgba(255,205,132,.07);color:#FFE5B9;font-size:12px;display:none}
    .alert.show{display:block}
    .feedback-wrap{max-width:860px;margin-inline:auto}
    .feedback-card{text-align:center;position:relative;overflow:hidden;border:1px solid var(--line-strong);background:radial-gradient(circle at 50% -40%,rgba(165,140,255,.23),transparent 58%),linear-gradient(160deg,#1A2238,#101828);border-radius:27px;padding:46px 29px;box-shadow:var(--shadow)}
    .feedback-emblem{width:72px;height:72px;margin:auto;display:grid;place-items:center;background:rgba(164,246,180,.07);border:1px solid rgba(164,246,180,.3);border-radius:22px;color:var(--green)}
    .feedback-emblem .ico{width:35px;height:35px}
    .feedback-card .micro,.result-card .micro{color:var(--green);font-size:11px;letter-spacing:.17em;font-weight:700;margin:24px 0 8px}
    .feedback-card h2,.result-card h2{margin:0 0 12px}
    .feedback-desc{font-size:13px;line-height:1.85;color:#BDCADC;margin:0 auto 20px;max-width:610px}
    .big-score{font-size:clamp(52px,8vw,79px);font-weight:700;letter-spacing:-.07em;line-height:1;color:var(--white);margin:10px 0 17px}
    .big-score span{color:var(--cyan)}
    .feedback-actions{display:flex;align-items:center;justify-content:center;gap:11px;flex-wrap:wrap;margin-top:22px}
    .review-list{margin:22px auto 0;display:grid;gap:10px;text-align:left;max-width:770px}
    .review-box{background:rgba(20,28,45,.9);border:1px solid var(--line);border-radius:14px;padding:15px 18px}
    .review-box strong{display:block;color:#F4F6FF;font-size:12px;line-height:1.65}
    .review-box p{margin:6px 0 0;color:#B7C6D9;font-size:11px;line-height:1.7}
    .review-label{display:block;color:var(--purple);font-size:9px;letter-spacing:.13em;font-weight:700;margin-bottom:8px}
    .result-layout{max-width:860px;margin:0 auto}
    .result-card{text-align:center;border:1px solid rgba(165,140,255,.28);border-radius:27px;padding:43px 28px 38px;background:radial-gradient(circle at 50% -42%,rgba(165,140,255,.24),transparent 65%),linear-gradient(150deg,#172238,#101727);box-shadow:var(--shadow)}
    .result-card.success{border-color:rgba(164,246,180,.48);background:radial-gradient(circle at 50% -48%,rgba(164,246,180,.20),transparent 64%),linear-gradient(155deg,#14283A,#111827)}
    .result-badge{width:92px;height:92px;margin:auto;display:grid;place-items:center;border-radius:28px;color:var(--cyan);border:1px solid rgba(115,221,239,.36);background:rgba(115,221,239,.07)}
    .result-card.success .result-badge{color:var(--green);border-color:rgba(164,246,180,.49);background:rgba(164,246,180,.07)}
    .result-badge .ico{width:45px;height:45px}
    .result-score{font-size:clamp(56px,9vw,96px);font-weight:700;letter-spacing:-.075em;line-height:1.05;margin:13px 0 16px}
    .result-score span{font-size:20px;color:#BAC9DA;letter-spacing:-.02em}
    .prize-banner{display:inline-flex;align-items:center;gap:9px;margin:9px auto 8px;border:1px solid rgba(164,246,180,.42);border-radius:99px;color:#C9FFD5;background:rgba(164,246,180,.085);padding:11px 17px;font-weight:700;font-size:12px;letter-spacing:.04em}
    .score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
    .score-item{border:1px solid var(--line);background:rgba(17,24,39,.8);padding:18px 14px;border-radius:16px;text-align:center}
    .score-item .label{font-size:11px;color:#A9B8CD;line-height:1.45;min-height:34px}
    .score-item .num{font-size:25px;font-weight:700;margin-top:9px;color:#E6EFFF}
    .score-item .num.perfect{color:var(--green)}
    .retry-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:19px}
    .small-note{font-size:11px;line-height:1.8;color:#96A7BB;margin:17px auto 0;max-width:600px}
    .screen-enter{animation:appear .32s ease both}
    @keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:800px){
      .intro-grid{grid-template-columns:1fr;gap:20px;padding-top:15px}
      .intro-text{max-width:660px}
      .mission-preview{max-width:680px;width:100%}
      .mission-heading{flex-direction:column;align-items:flex-start;gap:12px}
    }
    @media(max-width:540px){
      .shell{width:calc(100% - 30px)}
      .top-inner{min-height:71px}
      .brand-mark{width:39px;height:39px}
      .brand-title{font-size:11px}
      .brand-sub{font-size:8px}
      .top-tag{font-size:8px;padding:9px}
      .main{padding-top:31px;padding-bottom:45px}
      h1{font-size:clamp(44px,12vw,62px)}
      h2{font-size:32px}
      .intro-grid{gap:16px;padding-block:18px 10px}
      .intro-text .lead{font-size:15px}
      .intro-text .desc{font-size:12px}
      .hero-actions .btn{width:100%}
      .mission-preview{padding:17px}
      .mission-row{padding:15px 12px;gap:10px}
      .mission-info strong{font-size:12px}
      .mission-info span{font-size:10px}
      .mission-no{width:40px;height:40px;font-size:12px}
      .welcome-note{padding:14px 15px;align-items:flex-start}
      .main-card{padding:17px 15px}
      .chat-list{padding:17px 13px;gap:15px}
      .bubble{font-size:12px;padding:12px 13px}
      button.bubble{padding-right:35px}
      .bubble-row{max-width:96%}
      .bubble-row.child{max-width:88%}
      .card-top{flex-direction:column;align-items:flex-start;gap:7px}
      .scenario{padding:17px 16px}
      .scenario-text{font-size:13px}
      .story{padding:17px;gap:11px}
      .feedback-card,.result-card{padding:30px 18px}
      .score-grid{gap:7px}
      .score-item{padding:12px 6px}
      .score-item .label{font-size:9px}
      .score-item .num{font-size:21px}
      .mission-bottom .btn{width:100%}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div></div>
  <header class="topbar"><div class="shell top-inner">
    <div class="brand"><div class="brand-mark" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 20 5.7v5.8c0 5.2-3.7 8.9-8 10.5-4.3-1.6-8-5.3-8-10.5V5.7L12 2Z"/><path d="m8 12 2.3 2.4 5.2-5.3"/></svg></div><div><div class="brand-title">BEHIND THE AVATAR</div><span class="brand-sub">CYBER SAFETY CAMPAIGN</span></div></div>
    <div class="top-tag">INTERACTIVE EXPERIENCE</div>
  </div></header>
  <main class="main shell" id="app" aria-live="polite"></main>
  <footer class="footer"><div class="shell footer-in"><span>BEHIND THE AVATAR · CYBER SAFETY CAMPAIGN</span><span>Learn the signs. Make safer choices.</span></div></footer>
  <script>
    'use strict';
    // All challenge content is here. Edit the text in the arrays below as needed.
    // The website works offline; only the optional Google Font needs an internet connection.

    // MISSION 1: 5 player messages, including 3 red flags.
    // 1 point per true red flag, minus 1 for each false alarm (minimum 0).
    const CHAT = [
      { id:0, who:'player', text:'Nice teamwork! Want to join the next round?', unsafe:false, why:'Talking about another match is not automatically suspicious.' },
      { who:'child', text:'Maybe! That was fun.' },
      { id:1, who:'player', text:'Our team is using a private messaging app. Add me there instead of using the game chat.', unsafe:true, why:'An unknown player moving a child away from in-game safety controls is a warning sign.' },
      { id:2, who:'player', text:'Which game mode do you like the most?', unsafe:false, why:'Ordinary questions about gameplay are not necessarily unsafe.' },
      { who:'child', text:'I usually play team mode.' },
      { id:3, who:'player', text:'I can unlock a reward for your account. Send me the verification code you just received.', unsafe:true, why:'Verification codes must never be shared; this may be an account takeover attempt.' },
      { id:4, who:'player', text:'Please keep our conversation secret from your family. They might overreact.', unsafe:true, why:'Pressuring a child to hide conversations from trusted adults is a major red flag.' }
    ];

    // MISSION 2: 3 short, realistic situations.
    const SCENARIOS = [
      { text:'A user with a “Game Support” avatar asks for a one-time login code in chat to investigate an account issue.', answer:'unsafe', why:'A profile that looks official does not prove identity. Login codes should never be shared.' },
      { text:'An older sibling helps a child use the game’s official settings to limit direct messages to approved contacts.', answer:'safe', why:'Using official privacy settings with a trusted adult helps reduce unwanted contact.' },
      { text:'A player shares a link to an “exclusive event” on an unfamiliar website that looks similar to the game’s login page.', answer:'unsafe', why:'Unofficial look-alike login pages can steal account credentials, even when they appear convincing.' }
    ];

    // MISSION 3: one scenario, 2 practical safety decisions.
    const SHIELD = [
      { q:'Which contact setting would you choose first?', choices:['Allow messages from everyone','Allow only approved contacts, or disable direct messages if appropriate','Keep messages public but switch off notifications'], answer:1, why:'Limiting who can send direct messages reduces unwanted contact. Exact settings vary by game.' },
      { q:'If the child receives another unsettling message, what is the best response?', choices:['Confront the stranger using the child’s account','Ignore it and let the child continue the chat','Support the child, save relevant evidence safely, then block and report the account'], answer:2, why:'A supportive response, appropriate evidence preservation, and reporting protect the child without escalating contact.' }
    ];

    const TOTALS=[3,3,2];
    const LABELS=['Spot the Red Flags','Scam or Safe','Build Your Safety Shield'];
    const ICONS={
      arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',
      shield:'<path d="M12 2 20 5.7v5.8c0 5.2-3.7 8.9-8 10.5-4.3-1.6-8-5.3-8-10.5V5.7L12 2Z"/><path d="m8.4 12 2.4 2.4 4.8-4.8"/>',
      lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
      chat:'<path d="M20 11.5a8 8 0 0 1-8 8 9 9 0 0 1-4-.9L3 20l1.4-4.3A8 8 0 1 1 20 11.5Z"/><path d="M8 11h8m-8 3h4"/>',
      target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
      check:'<path d="m5 12 4 4L19 6"/>',
      alert:'<path d="M10.3 3.7 2.3 18a2 2 0 0 0 1.7 3h16a2 2 0 0 0 1.7-3l-8-14.3a2 2 0 0 0-3.4 0Z"/><path d="M12 9v5m0 3h.01"/>',
      refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.5 8.4A7.5 7.5 0 0 1 19 12m-1.5 3.6A7.5 7.5 0 0 1 5 12"/>',
      users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2"/><path d="M17 5a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 5"/>',
      sparkle:'<path d="m12 3 1.8 6.2L20 11l-6.2 1.8L12 19l-1.8-6.2L4 11l6.2-1.8L12 3ZM20 18l.6 1.4L22 20l-1.4.6L20 22l-.6-1.4L18 20l1.4-.6L20 18Z"/>',
      back:'<path d="m14 6-6 6 6 6"/>',
      clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',
      flag:'<path d="M4 22V4m0 1c5-4 10 4 16 0v12c-6 4-11-4-16 0"/>',
      trophy:'<path d="M8 21h8m-4-4v4M7 3h10v7a5 5 0 0 1-10 0V3ZM7 5H4v3a4 4 0 0 0 4 4m9-7h3v3a4 4 0 0 1-4 4"/>',
      tickcircle:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>'
    };
    function icon(name,cls='ico'){return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.shield}</svg>`}
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

    const app=document.getElementById('app');
    let stage='welcome'; // welcome | mission | result
    let mission=0;
    let flagged=new Set();
    let answers2=Array(SCENARIOS.length).fill(null);
    let answers3=Array(SHIELD.length).fill(null);
    let scores=[null,null,null];
    let lastReview=[]; // Collected for internal scoring; no intermediate retry screens.

    function topProgress(i){return `<div class="progress-row"><span class="progress-left">MISSION ${String(i+1).padStart(2,'0')} / 03</span><span class="progress-right">${i+1} of 3 challenges</span></div><div class="progress-track" role="progressbar" aria-label="Challenge progress" aria-valuenow="${i+1}" aria-valuemin="0" aria-valuemax="3"><div class="progress-fill" style="width:${(i+1)/3*100}%"></div></div>`}
    function head(i,tag,title,subtitle){return `${topProgress(i)}<div class="mission-heading"><div><span class="eyebrow"><span class="pulse"></span>${esc(tag)}</span><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><div class="mission-chip">${TOTALS[i]} POINTS</div></div>`}
    function renderWelcome(){
      app.innerHTML=`<section class="intro-grid screen-enter"><div class="intro-text"><span class="eyebrow"><span class="pulse"></span> READY TO PLAY?</span><h1>THE CYBER<br><span class="gradient">SAFETY</span><br>CHALLENGE<span style="color:var(--green)">.</span></h1><p class="lead">Do you know what can hide behind a friendly avatar?</p><p class="desc">Three interactive missions will test how well you recognize online gaming risks, spot suspicious messages, and make safer choices for a child in your family. Designed for students and adults — no technical background needed.</p><div class="hero-actions"><button class="btn btn-primary" data-action="start">Start the Challenge ${icon('arrow')}</button></div><div class="mini-stats"><span class="mini-stat">${icon('clock')} About 3–4 minutes</span><span class="mini-stat">${icon('target')} 3 missions</span><span class="mini-stat">${icon('shield')} No sign-in required</span></div></div><aside class="mission-preview"><div class="panel-top"><span class="panel-label">YOUR MISSIONS</span><span class="panel-status"><span class="pulse"></span> 3 SHORT MISSIONS</span></div>${[
        ['purple','01','Spot the Red Flags','Find hidden warning signs in a chat.'],
        ['cyan','02','Scam or Safe','Judge everyday gaming situations.'],
        ['green','03','Build Your Safety Shield','Choose safe settings and actions.']
      ].map(x=>`<div class="mission-row"><span class="mission-no ${x[0]}">${x[1]}</span><div class="mission-info"><strong>${x[2]}</strong><span>${x[3]}</span></div>${icon('arrow')}</div>`).join('')}</aside></section><div class="welcome-note">${icon('shield')}<span><strong style="color:var(--white)">Your goal:</strong> complete all three missions with full marks to unlock the reward screen. Your answers count once per mission. Your score appears after all three missions.</span></div>`;
    }
    function renderMission(){
      if(mission===0) renderChat();
      else if(mission===1) renderScenarios();
      else renderShield();
    }
    function renderChat(){
      app.innerHTML=`<section class="screen-enter">${head(0,'MISSION 01 · CHAT DETECTIVE','Spot the Red Flags','Your younger sibling has been chatting with a player they just met in an online game. Tap the suspicious messages from the unknown player. Leave normal gaming messages unselected. False alarms lower your score.')}<div class="main-card"><div class="card-top"><div class="card-top-title">${icon('chat')} In-game chat · fictional example</div><span class="card-hint">Tap a player message to select it</span></div><div class="chat-panel"><div class="chat-header"><div class="profile-badge">N</div><div><div class="profile-name">NEXO · Unknown player</div><div class="profile-detail">Conversation with your younger sibling</div></div><span class="header-dots">•••</span></div><div class="chat-list">${CHAT.map(m=>m.who==='child'?`<div class="bubble-row child"><span class="bubble-who">YOUR SIBLING</span><div class="bubble child-bubble">${esc(m.text)}</div></div>`:`<div class="bubble-row"><span class="bubble-who">NEXO</span><button class="bubble ${flagged.has(m.id)?'selected':''}" data-flag="${m.id}" aria-pressed="${flagged.has(m.id)}">${esc(m.text)}</button></div>`).join('')}</div></div><div id="validation" class="alert" role="alert"></div><div class="mission-bottom"><div class="selected-count"><strong id="flagCount">${flagged.size}</strong> messages flagged · Select only suspicious ones</div><button class="btn btn-primary" data-action="submit">Check My Answers ${icon('arrow')}</button></div></div></section>`;
    }
    function renderScenarios(){
      app.innerHTML=`<section class="screen-enter">${head(1,'MISSION 02 · QUICK DECISIONS','Scam or Safe','You are helping a child in your family navigate online gaming. Decide whether each situation is safe or unsafe. Consider the full context before choosing.')}<div class="question-stack">${SCENARIOS.map((s,i)=>`<article class="scenario"><div class="scenario-head"><span class="scenario-index">SCENARIO ${String(i+1).padStart(2,'0')}</span><span class="scenario-value">01 POINT</span></div><p class="scenario-text">${esc(s.text)}</p><div class="choice-row" role="group" aria-label="Scenario ${i+1}: Safe or Unsafe"><button class="choice ${answers2[i]==='safe'?'picked':''}" data-scenario="${i}" data-value="safe" aria-pressed="${answers2[i]==='safe'}">${icon('check')} Safe</button><button class="choice ${answers2[i]==='unsafe'?'picked':''}" data-scenario="${i}" data-value="unsafe" aria-pressed="${answers2[i]==='unsafe'}">${icon('alert')} Unsafe</button></div></article>`).join('')}</div><div id="validation" class="alert" role="alert"></div><div class="mission-bottom"><span class="selected-count">Answer all 3 scenarios</span><button class="btn btn-primary" data-action="submit">Check My Answers ${icon('arrow')}</button></div></section>`;
    }
    function renderShield(){
      app.innerHTML=`<section class="screen-enter">${head(2,'MISSION 03 · SAFETY SETTINGS','Build Your Safety Shield','One situation. Two decisions. Choose the safest settings and actions for a child playing online.')}<div class="story"> <div class="story-icon">${icon('shield')}</div><div><h3>THE SITUATION</h3><p>Your 12-year-old cousin has been receiving messages and friend requests from unknown players. You are helping their parent make the account safer. What should you do?</p></div></div><div class="question-stack">${SHIELD.map((s,i)=>`<article class="scenario"><div class="scenario-head"><span class="scenario-index">SAFETY DECISION ${String(i+1).padStart(2,'0')}</span><span class="scenario-value">01 POINT</span></div><p class="scenario-text">${esc(s.q)}</p><div class="wide-choices" role="group" aria-label="Safety decision ${i+1}">${s.choices.map((c,j)=>`<button class="choice ${answers3[i]===j?'picked':''}" data-shield="${i}" data-value="${j}" aria-pressed="${answers3[i]===j}"><span class="tag">${String.fromCharCode(65+j)}.</span>${esc(c)}</button>`).join('')}</div></article>`).join('')}</div><div id="validation" class="alert" role="alert"></div><div class="mission-bottom"><span class="selected-count">Choose one answer for each question</span><button class="btn btn-primary" data-action="submit">Complete the Mission ${icon('arrow')}</button></div></section>`;
    }
    function showValidation(message){let e=document.getElementById('validation');if(e){e.textContent=message;e.classList.add('show');e.scrollIntoView({block:'nearest',behavior:'smooth'})}}
    function submitMission(){
      lastReview=[];
      let points=0;
      if(mission===0){
        const items=CHAT.filter(x=>x.who==='player');
        if(flagged.size===0){showValidation('Select the messages you think are suspicious before checking your answers.');return;}
        let realFlags=0, falseAlarms=0;
        for(const m of items){
          const picked=flagged.has(m.id);
          if(m.unsafe&&picked)realFlags++;
          if(!m.unsafe&&picked)falseAlarms++;
          if(picked!==m.unsafe)lastReview.push({title:m.text,what:`${m.unsafe?'Red flag':'Normal gaming chat'}. ${m.why}`});
        }
        points=Math.max(0,realFlags-falseAlarms);
      } else if(mission===1){
        if(answers2.some(x=>x===null)){showValidation('Please answer all three scenarios before continuing.');return;}
        for(let i=0;i<SCENARIOS.length;i++) {let q=SCENARIOS[i];if(answers2[i]===q.answer)points++;else lastReview.push({title:`Scenario ${i+1}: ${q.answer.toUpperCase()}`,what:q.why});}
      }else{
        if(answers3.some(x=>x===null)){showValidation('Please choose one answer for every safety decision.');return;}
        for(let i=0;i<SHIELD.length;i++){let q=SHIELD[i];if(answers3[i]===q.answer)points++;else lastReview.push({title:`Decision ${i+1}: ${q.choices[q.answer]}`,what:q.why});}
      }
      scores[mission]=points;
      // Move straight to the next mission, even when some answers are incorrect.
      // No retry screen or extra step interrupts the challenge.
      if(mission===2){stage='result';render();}
      else{resetMission(mission+1);}
    }
    function renderResult(){
      const earned=scores.reduce((a,b)=>a+(b??0),0);
      const total=TOTALS.reduce((a,b)=>a+b,0);
      const perfect=earned===total;
      app.innerHTML=`<section class="result-layout screen-enter"><div class="result-card ${perfect?'success':''}"><div class="result-badge">${icon(perfect?'trophy':'shield')}</div><p class="micro">BEHIND THE AVATAR · CHALLENGE RESULTS</p><h2>${perfect?'ALL MISSIONS CLEARED!':'CHALLENGE COMPLETED'}</h2><p class="feedback-desc">${perfect?'You completed every mission with full marks. You know how to recognize warning signs and protect a child in online gaming.':'You completed all three missions. Your score reflects your first choices in each mission. Keep the safety lessons in mind!'}</p><div class="result-score">${earned}<span> / ${total} POINTS</span></div>${perfect?`<div class="prize-banner">${icon('check')} REWARD ELIGIBLE</div><p class="feedback-desc" style="margin-top:12px">Show this screen to the campaign team to claim your giveaway, subject to prize availability.</p>`:`<div class="prize-banner" style="border-color:rgba(165,140,255,.35);color:#DCCEFF;background:rgba(165,140,255,.06)">${icon('target')} PERFECT SCORE NEEDED</div>`}</div><div class="score-grid">${scores.map((s,i)=>`<div class="score-item"><div class="label">${LABELS[i]}</div><div class="num ${s===TOTALS[i]?'perfect':''}">${s??0} / ${TOTALS[i]}</div></div>`).join('')}</div><div style="display:flex;justify-content:center;margin-top:24px"><button class="btn ${perfect?'btn-primary':'btn-outline'}" data-action="restart">${icon('refresh')} Start for a New Player</button></div><p class="small-note" style="text-align:center">All questions use fictional examples. No personal information or results are collected or stored by this page.</p></section>`;
    }
    function resetMission(i){mission=i;flagged=new Set();answers2=Array(SCENARIOS.length).fill(null);answers3=Array(SHIELD.length).fill(null);stage='mission';render();}
    function render(){
      if(stage==='welcome')renderWelcome();
      if(stage==='mission')renderMission();
      if(stage==='result')renderResult();
      window.scrollTo(0,0);
    }
    document.addEventListener('click',e=>{
      let btn=e.target.closest('button');if(!btn)return;
      if(btn.hasAttribute('data-flag')){
        const id=Number(btn.dataset.flag);if(flagged.has(id))flagged.delete(id);else flagged.add(id);
        btn.classList.toggle('selected',flagged.has(id));btn.setAttribute('aria-pressed',String(flagged.has(id)));
        const n=document.getElementById('flagCount');if(n)n.textContent=flagged.size;
        return;
      }
      if(btn.hasAttribute('data-scenario')){
        const i=Number(btn.dataset.scenario);answers2[i]=btn.dataset.value;
        document.querySelectorAll(`[data-scenario="${i}"]`).forEach(x=>{x.classList.toggle('picked',x.dataset.value===answers2[i]);x.setAttribute('aria-pressed',String(x.dataset.value===answers2[i]))});
        const v=document.getElementById('validation');if(v)v.classList.remove('show');return;
      }
      if(btn.hasAttribute('data-shield')){
        const i=Number(btn.dataset.shield);answers3[i]=Number(btn.dataset.value);
        document.querySelectorAll(`[data-shield="${i}"]`).forEach(x=>{let p=Number(x.dataset.value)===answers3[i];x.classList.toggle('picked',p);x.setAttribute('aria-pressed',String(p))});
        const v=document.getElementById('validation');if(v)v.classList.remove('show');return;
      }
      switch(btn.dataset.action){
        case 'start':resetMission(0);break;
        case 'submit':submitMission();break;
        case 'restart':scores=[null,null,null];mission=0;flagged=new Set();answers2=Array(SCENARIOS.length).fill(null);answers3=Array(SHIELD.length).fill(null);stage='welcome';render();break;
      }
    });
    render();
  </script>
</body>
</html>
